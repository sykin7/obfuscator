<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 代码安全控制台</title>
    <script src="https://cdn.jsdelivr.net/npm/javascript-obfuscator/dist/index.browser.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .navbar {
            height: 60px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
        }

        .brand i { color: var(--accent); font-size: 20px; }

        .actions { display: flex; gap: 12px; align-items: center; }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-primary { background-color: var(--accent); color: #0f172a; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-primary); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

        .lang-select {
            background-color: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            margin-right: 8px;
        }
        .lang-select:hover { border-color: var(--accent); }

        .layout-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .config-panel {
            width: 360px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .config-section {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .section-header {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group { margin-bottom: 16px; }
        .form-group:last-child { margin-bottom: 0; }
        
        label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-primary); }
        
        .sub-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; display: block; }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            background-color: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            transition: border 0.2s;
        }
        
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-input);
            transition: .4s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(16px); }

        .range-container { display: flex; align-items: center; gap: 10px; }
        input[type="range"] { flex: 1; accent-color: var(--accent); height: 4px; }
        .range-value { font-size: 12px; color: var(--text-secondary); width: 35px; text-align: right; }

        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-body);
            min-width: 0;
        }

        .editor-split {
            flex: 1;
            display: flex;
            gap: 1px;
            background-color: var(--border); 
            min-height: 0;
        }

        .code-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-body);
            min-width: 0;
        }

        .pane-header {
            padding: 10px 16px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pane-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); }

        .code-textarea {
            flex: 1;
            width: 100%;
            background-color: var(--bg-body);
            color: #d4d4d4;
            border: none;
            padding: 20px;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: none;
        }

        .stats-footer {
            height: 30px;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 11px;
            color: var(--text-secondary);
            gap: 20px;
            flex-shrink: 0;
        }

        .stat-item { display: flex; align-items: center; gap: 6px; }
        .stat-item i { font-size: 10px; }

        .toast {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

    </style>
</head>
<body>

<nav class="navbar">
    <div class="brand">
        <i class="fas fa-shield-halved"></i>
        <span data-i18n="title">JS 安全控制台</span>
    </div>
    <div class="actions">
        <select class="lang-select" onchange="app.setLanguage(this.value)">
            <option value="zh" selected>🇨🇳 中文</option>
            <option value="en">🇺🇸 English</option>
        </select>
        <input type="file" id="fileUpload" style="display:none" accept=".js">
        <button class="btn btn-outline" onclick="document.getElementById('fileUpload').click()">
            <i class="fas fa-upload"></i> <span data-i18n="btnImport">导入文件</span>
        </button>
        <button class="btn btn-primary" id="btnObfuscate" onclick="app.process()">
            <i class="fas fa-bolt"></i> <span data-i18n="btnBuild">执行混淆</span>
        </button>
    </div>
</nav>

<div class="layout-container">
    <aside class="config-panel">
        
        <div class="config-section">
            <div class="section-header"><i class="fas fa-cog"></i> <span data-i18n="secCore">核心设置</span></div>
            
            <div class="form-group">
                <label data-i18n="lblTarget">运行环境</label>
                <select id="opt_target">
                    <option value="browser" data-i18n="optBrowser">Web 浏览器 (默认)</option>
                    <option value="browser-no-eval" data-i18n="optBrowserNoEval">Web 浏览器 (无 Eval)</option>
                    <option value="node" data-i18n="optNode">Node.js 后端</option>
                </select>
            </div>

            <div class="toggle-row">
                <label data-i18n="lblCompact">代码压缩</label>
                <label class="switch">
                    <input type="checkbox" id="opt_compact" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="toggle-row">
                <label data-i18n="lblSelfDefending">自我防护机制</label>
                <label class="switch">
                    <input type="checkbox" id="opt_selfDefending">
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="form-group">
                <label data-i18n="lblSeed">随机种子 (Seed)</label>
                <div style="display:flex; gap:8px;">
                    <input type="number" id="opt_seed" value="0" placeholder="0 = 随机">
                    <button class="btn btn-outline" style="padding:4px 8px;" onclick="document.getElementById('opt_seed').value = Math.floor(Math.random() * 999999)"><i class="fas fa-random"></i></button>
                </div>
            </div>
        </div>

        <div class="config-section">
            <div class="section-header"><i class="fas fa-random"></i> <span data-i18n="secTrans">变形设置</span></div>
            
            <div class="toggle-row">
                <label data-i18n="lblControlFlow">控制流平坦化</label>
                <label class="switch">
                    <input type="checkbox" id="opt_controlFlow" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="form-group">
                <div class="range-container">
                    <input type="range" id="opt_controlFlowThreshold" min="0" max="1" step="0.1" value="0.75" oninput="app.updateRange(this)">
                    <span class="range-value" id="val_controlFlowThreshold">0.75</span>
                </div>
                <span class="sub-label" data-i18n="lblProb">触发概率阈值</span>
            </div>

            <div class="toggle-row" style="margin-top: 20px;">
                <label data-i18n="lblDeadCode">僵尸代码注入</label>
                <label class="switch">
                    <input type="checkbox" id="opt_deadCode">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="form-group">
                <div class="range-container">
                    <input type="range" id="opt_deadCodeThreshold" min="0" max="1" step="0.1" value="0.4" oninput="app.updateRange(this)">
                    <span class="range-value" id="val_deadCodeThreshold">0.4</span>
                </div>
                <span class="sub-label" data-i18n="lblProb">触发概率阈值</span>
            </div>
        </div>

        <div class="config-section">
            <div class="section-header"><i class="fas fa-font"></i> <span data-i18n="secString">字符串加密</span></div>
            
            <div class="toggle-row">
                <label data-i18n="lblStringArray">启用字符串阵列</label>
                <label class="switch">
                    <input type="checkbox" id="opt_stringArray" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="form-group">
                <label data-i18n="lblEncoding">编码算法</label>
                <select id="opt_stringEncoding">
                    <option value="none" data-i18n="optNone">不编码</option>
                    <option value="base64">Base64</option>
                    <option value="rc4" data-i18n="optRC4">RC4 (推荐)</option>
                </select>
            </div>

            <div class="toggle-row">
                <label data-i18n="lblRotate">阵列旋转</label>
                <label class="switch">
                    <input type="checkbox" id="opt_rotate" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="toggle-row">
                <label data-i18n="lblShuffle">阵列乱序</label>
                <label class="switch">
                    <input type="checkbox" id="opt_shuffle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="form-group">
                <label data-i18n="lblThreshold">加密阈值</label>
                <div class="range-container">
                    <input type="range" id="opt_stringThreshold" min="0" max="1" step="0.1" value="0.75" oninput="app.updateRange(this)">
                    <span class="range-value" id="val_stringThreshold">0.75</span>
                </div>
            </div>
        </div>

        <div class="config-section">
            <div class="section-header"><i class="fas fa-fingerprint"></i> <span data-i18n="secId">标识符混淆</span></div>
            
            <div class="form-group">
                <label data-i18n="lblRenameStrategy">重命名策略</label>
                <select id="opt_identifierGenerator">
                    <option value="hexadecimal" data-i18n="optHex">十六进制 (默认)</option>
                    <option value="mangled" data-i18n="optMangled">短字符 (Mangled)</option>
                    <option value="dictionary" data-i18n="optDict">字典模式</option>
                </select>
            </div>

            <div class="toggle-row">
                <label data-i18n="lblRenameGlobal">重命名全局变量</label>
                <label class="switch">
                    <input type="checkbox" id="opt_renameGlobals">
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="form-group">
                <label data-i18n="lblPrefix">变量前缀</label>
                <input type="text" id="opt_idPrefix" placeholder="_0x">
                <span class="sub-label" data-i18n="subPrefix">统一添加的变量前缀</span>
            </div>
        </div>

        <div class="config-section">
            <div class="section-header"><i class="fas fa-shield-alt"></i> <span data-i18n="secLock">安全防护 & 锁定</span></div>
            
            <div class="toggle-row">
                <label data-i18n="lblDebug">防调试检测</label>
                <label class="switch">
                    <input type="checkbox" id="opt_debug">
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="toggle-row">
                <label data-i18n="lblConsole">禁用控制台</label>
                <label class="switch">
                    <input type="checkbox" id="opt_disableConsole">
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="form-group">
                <label data-i18n="lblDomain">域名锁定</label>
                <textarea id="opt_domainLock" rows="2" placeholder="example.com, sub.example.com"></textarea>
                <span class="sub-label" data-i18n="subDomain">仅允许代码在指定域名下运行，逗号分隔。</span>
            </div>
        </div>
        
        <div style="height: 50px;"></div>
    </aside>

    <main class="editor-area">
        <div class="editor-split">
            <div class="code-pane">
                <div class="pane-header">
                    <span class="pane-title" data-i18n="titleInput">源代码 (INPUT)</span>
                    <button class="btn btn-outline" style="padding: 4px 8px; font-size: 11px;" onclick="app.clear()">
                        <i class="fas fa-trash"></i> <span data-i18n="btnClear">清空</span>
                    </button>
                </div>
                <textarea class="code-textarea" id="inputCode" placeholder="// 在此粘贴 JavaScript 代码..." spellcheck="false"></textarea>
            </div>
            
            <div class="code-pane">
                <div class="pane-header">
                    <span class="pane-title" data-i18n="titleOutput">混淆结果 (OUTPUT)</span>
                    <button class="btn btn-outline" style="padding: 4px 8px; font-size: 11px;" onclick="app.copy()">
                        <i class="far fa-copy"></i> <span data-i18n="btnCopy">复制</span>
                    </button>
                </div>
                <textarea class="code-textarea" id="outputCode" readonly spellcheck="false" placeholder="等待处理..."></textarea>
            </div>
        </div>
        
        <div class="stats-footer">
            <div class="stat-item" id="stat_status"><i class="fas fa-circle" style="color: #64748b;"></i> <span data-i18n="statReady">就绪</span></div>
            <div style="width: 1px; height: 14px; background: var(--border);"></div>
            <div class="stat-item"><i class="fas fa-file-code"></i> <span data-i18n="statOrig">原始大小</span>: <span id="stat_orig">0 B</span></div>
            <div class="stat-item"><i class="fas fa-compress-arrows-alt"></i> <span data-i18n="statObf">混淆大小</span>: <span id="stat_obf">0 B</span></div>
        </div>
    </main>
</div>

<div class="toast" id="toast">
    <i class="fas fa-info-circle"></i>
    <span id="toastMsg">Notification</span>
</div>

<script>
    const translations = {
        zh: {
            title: "JS 安全控制台",
            btnImport: "导入文件",
            btnBuild: "执行混淆",
            secCore: "核心设置",
            lblTarget: "运行环境",
            optBrowser: "Web 浏览器 (默认)",
            optBrowserNoEval: "Web 浏览器 (无 Eval)",
            optNode: "Node.js 后端",
            lblCompact: "代码压缩",
            lblSelfDefending: "自我防护机制",
            lblSeed: "随机种子 (Seed)",
            secTrans: "变形设置",
            lblControlFlow: "控制流平坦化",
            lblProb: "触发概率阈值",
            lblDeadCode: "僵尸代码注入",
            secString: "字符串加密",
            lblStringArray: "启用字符串阵列",
            lblEncoding: "编码算法",
            optNone: "不编码",
            optRC4: "RC4 (推荐)",
            lblRotate: "阵列旋转",
            lblShuffle: "阵列乱序",
            lblThreshold: "加密阈值",
            secId: "标识符混淆",
            lblRenameStrategy: "重命名策略",
            optHex: "十六进制 (默认)",
            optMangled: "短字符 (Mangled)",
            optDict: "字典模式",
            lblRenameGlobal: "重命名全局变量",
            lblPrefix: "变量前缀",
            subPrefix: "统一添加的变量前缀",
            secLock: "安全防护 & 锁定",
            lblDebug: "防调试检测",
            lblConsole: "禁用控制台",
            lblDomain: "域名锁定",
            subDomain: "仅允许代码在指定域名下运行，逗号分隔。",
            titleInput: "源代码 (INPUT)",
            btnClear: "清空",
            titleOutput: "混淆结果 (OUTPUT)",
            btnCopy: "复制",
            statReady: "就绪",
            statOrig: "原始大小",
            statObf: "混淆大小",
            msgLoaded: "文件已加载: ",
            msgInput: "请先输入源代码。",
            msgBuild: "处理中...",
            msgSuccess: "混淆处理完成",
            msgError: "处理失败",
            msgCopied: "已复制到剪贴板",
            phInput: "// 在此粘贴 JavaScript 代码...",
            phOutput: "等待处理..."
        },
        en: {
            title: "JS Security Console",
            btnImport: "Import File",
            btnBuild: "Obfuscate Code",
            secCore: "Core Settings",
            lblTarget: "Target Environment",
            optBrowser: "Web Browser (Default)",
            optBrowserNoEval: "Web Browser (No Eval)",
            optNode: "Node.js Backend",
            lblCompact: "Compact Code",
            lblSelfDefending: "Self Defending",
            lblSeed: "Seed (Randomization)",
            secTrans: "Transformation",
            lblControlFlow: "Control Flow Flattening",
            lblProb: "Probability Threshold",
            lblDeadCode: "Dead Code Injection",
            secString: "String Array",
            lblStringArray: "String Array",
            lblEncoding: "Encoding Algorithm",
            optNone: "None",
            optRC4: "RC4 (Strongest)",
            lblRotate: "Rotate Array",
            lblShuffle: "Shuffle Array",
            lblThreshold: "Threshold",
            secId: "Identifiers",
            lblRenameStrategy: "Renaming Strategy",
            optHex: "Hexadecimal (Default)",
            optMangled: "Mangled (Short)",
            optDict: "Dictionary",
            lblRenameGlobal: "Rename Globals",
            lblPrefix: "Identifier Prefix",
            subPrefix: "Prefix for all renamed variables",
            secLock: "Protection & Locks",
            lblDebug: "Debug Protection",
            lblConsole: "Disable Console",
            lblDomain: "Domain Lock",
            subDomain: "Comma separated. Code runs only on these domains.",
            titleInput: "INPUT (SOURCE)",
            btnClear: "Clear",
            titleOutput: "OUTPUT (DIST)",
            btnCopy: "Copy",
            statReady: "Ready",
            statOrig: "Original",
            statObf: "Obfuscated",
            msgLoaded: "File loaded: ",
            msgInput: "Please input source code first.",
            msgBuild: "Building...",
            msgSuccess: "Build Successful",
            msgError: "Build Failed",
            msgCopied: "Copied to clipboard",
            phInput: "// Paste JavaScript code here...",
            phOutput: "Waiting for build..."
        }
    };

    let currentLang = 'zh';

    const app = {
        init: () => {
            document.getElementById('fileUpload').addEventListener('change', app.handleFile);
            document.getElementById('inputCode').addEventListener('input', app.updateStats);
        },

        setLanguage: (lang) => {
            currentLang = lang;
            const t = translations[lang];
            
            // Text Content
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });

            // Placeholders
            document.getElementById('inputCode').placeholder = t.phInput;
            document.getElementById('outputCode').placeholder = t.phOutput;

            // Re-update status text
            app.updateStats(); 
        },

        updateRange: (el) => {
            document.getElementById('val_' + el.id.replace('opt_', '')).textContent = el.value;
        },

        handleFile: (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                document.getElementById('inputCode').value = event.target.result;
                app.updateStats();
                app.notify(translations[currentLang].msgLoaded + file.name, 'success');
            };
            reader.readAsText(file);
        },

        getConfig: () => {
            const getVal = (id) => document.getElementById(id).value;
            const getCheck = (id) => document.getElementById(id).checked;
            const getNum = (id) => parseFloat(document.getElementById(id).value);

            const encVal = getVal('opt_stringEncoding');
            const stringArrayEncoding = encVal === 'none' ? false : [encVal];

            const domains = getVal('opt_domainLock').split(',').map(d => d.trim()).filter(d => d);

            return {
                target: getVal('opt_target'),
                seed: getNum('opt_seed'),
                compact: getCheck('opt_compact'),
                selfDefending: getCheck('opt_selfDefending'),
                
                controlFlowFlattening: getCheck('opt_controlFlow'),
                controlFlowFlatteningThreshold: getNum('opt_controlFlowThreshold'),
                
                deadCodeInjection: getCheck('opt_deadCode'),
                deadCodeInjectionThreshold: getNum('opt_deadCodeThreshold'),
                
                stringArray: getCheck('opt_stringArray'),
                stringArrayEncoding: stringArrayEncoding,
                stringArrayRotate: getCheck('opt_rotate'),
                stringArrayShuffle: getCheck('opt_shuffle'),
                stringArrayThreshold: getNum('opt_stringThreshold'),
                
                identifierNamesGenerator: getVal('opt_identifierGenerator'),
                identifiersPrefix: getVal('opt_idPrefix') || '',
                renameGlobals: getCheck('opt_renameGlobals'),
                
                debugProtection: getCheck('opt_debug'),
                disableConsoleOutput: getCheck('opt_disableConsole'),
                domainLock: domains,
                
                numbersToExpressions: true,
                simplify: true,
                splitStrings: true,
                splitStringsChunkLength: 10,
                transformObjectKeys: true,
                unicodeEscapeSequence: false
            };
        },

        process: () => {
            const source = document.getElementById('inputCode').value;
            const t = translations[currentLang];
            
            if (!source.trim()) {
                app.notify(t.msgInput, 'error');
                return;
            }

            const btn = document.getElementById('btnObfuscate');
            const icon = btn.querySelector('i');
            const span = btn.querySelector('span');
            const originalText = span.textContent;
            
            icon.className = 'fas fa-circle-notch fa-spin';
            span.textContent = t.msgBuild;
            btn.disabled = true;

            setTimeout(() => {
                try {
                    const config = app.getConfig();
                    const result = JavaScriptObfuscator.obfuscate(source, config);
                    
                    document.getElementById('outputCode').value = result.getObfuscatedCode();
                    app.updateStats();
                    app.notify(t.msgSuccess, 'success');
                    
                    document.getElementById('stat_status').innerHTML = `<i class="fas fa-check-circle" style="color: var(--success)"></i> ${t.msgSuccess}`;
                    
                } catch (err) {
                    console.error(err);
                    document.getElementById('outputCode').value = `/* ERROR */\n\n${err.message}`;
                    app.notify(t.msgError, 'error');
                    document.getElementById('stat_status').innerHTML = `<i class="fas fa-exclamation-triangle" style="color: var(--danger)"></i> Error`;
                } finally {
                    icon.className = 'fas fa-bolt';
                    span.textContent = originalText;
                    btn.disabled = false;
                }
            }, 100);
        },

        copy: () => {
            const out = document.getElementById('outputCode');
            if (!out.value) return;
            out.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            app.notify(translations[currentLang].msgCopied, 'success');
        },

        clear: () => {
            document.getElementById('inputCode').value = '';
            document.getElementById('outputCode').value = '';
            app.updateStats();
        },

        updateStats: () => {
            const inputLen = new Blob([document.getElementById('inputCode').value]).size;
            const outputLen = new Blob([document.getElementById('outputCode').value]).size;
            const t = translations[currentLang];
            
            document.getElementById('stat_orig').textContent = app.formatBytes(inputLen);
            document.getElementById('stat_obf').textContent = app.formatBytes(outputLen);
            
            // 如果状态栏不是"完成"状态，则重置为就绪
            if(!document.getElementById('stat_status').innerHTML.includes('check-circle')) {
                 document.getElementById('stat_status').innerHTML = `<i class="fas fa-circle" style="color: #64748b;"></i> ${t.statReady}`;
            }
        },

        formatBytes: (bytes) => {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        },

        notify: (msg, type) => {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            
            toast.className = `toast ${type}`;
            toastMsg.textContent = msg;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    };

    app.init();
</script>

</body>
</html>
